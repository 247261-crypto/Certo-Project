<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certo Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER START -->
<header class="header">
    <div class="container">
        <div class="row align-items-center g-3">
            <!-- Logo column -->
            <div class="col-6 col-md-3">
                <img src="images\logo.png"
                     alt="Certo logo"
                     class="logo"
                     />
            </div>

            <!-- Navigation with increased spacing -->
            <div class="col-md-6 d-none d-md-flex justify-content-center">
                <div class="main-nav">
                    <a href="#">iPhone</a>
                    <a href="#">Android</a>
                    <a href="#">Help</a>
                    <a href="#">Company</a>
                </div>
            </div>

            <!-- Sign In button -->
            <div class="col-6 col-md-3 text-end">
                <a href="#" class="btn-signin">Sign in</a>
            </div>
        </div>
    </div>
</header>
    <!-- HEADER END -->


  <!-- HERO SECTION START -->
<section class="hero">
    <div class="container">
        <div class="row align-items-center">

            <!-- LEFT CONTENT -->
            <div class="col-lg-6">
                <h1>Your mobile privacy <br> is our mission</h1>

                <p>
                    Think your phone has been hacked? Our trusted apps make it easy
                    for you to scan, detect and remove threats from your iPhone and Android devices.
                </p>

                <div class="hero-buttons">
                    <a href="#" class="btn btn-primary-custom">Get Certo for iPhone</a>
                    <a href="#" class="btn btn-outline-custom">Get Certo for Android</a>
                </div>
            </div>

            <!-- RIGHT IMAGE -->
            <div class="col-lg-6 hero-image-col">
                <div class="hero-image-wrapper">
                    <div class="hero-image-box">
                        <img src="images\home-header-2.png.png" class="hero-img">
                        <img src="images\figure (1).png" class = "mobile-overlay-img">
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
<!-- HERO SECTION END -->

</body>
</html>
